name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]
      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options: [all, android-arm64, android-arm, android-x64]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Inject token
        run: |
          sed -i "s/GITHUB_TOKEN_PLACEHOLDER/${{ secrets.VF_KEYS_TOKEN }}/" lib/services/license_service.dart

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android --org com.card --project-name card_vodafone .

      - name: Inject MainActivity
        run: |
          KOTLIN_DIR="android/app/src/main/kotlin/com/card/developerAlaa"
          mkdir -p "$KOTLIN_DIR"
          cat > "$KOTLIN_DIR/MainActivity.kt" << 'KOTLIN'
package com.card.developerAlaa

import android.content.pm.PackageManager
import android.os.Build
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.security.MessageDigest

class MainActivity : FlutterActivity() {
    private val CHANNEL = "com.card.developerAlaa/security"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
            when (call.method) {
                "getSignature" -> {
                    try {
                        val pm = packageManager
                        val packageInfo = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                            pm.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                        } else {
                            @Suppress("DEPRECATION")
                            pm.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                        }
                        val signatures = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                            packageInfo.signingInfo.apkContentsSigners
                        } else {
                            @Suppress("DEPRECATION")
                            packageInfo.signatures
                        }
                        val md = MessageDigest.getInstance("SHA-256")
                        md.update(signatures[0].toByteArray())
                        val digest = md.digest()
                        val hexString = digest.joinToString("") { "%02x".format(it) }
                        result.success(hexString)
                    } catch (e: Exception) {
                        result.error("ERROR", e.message, null)
                    }
                }
                "getBuildTags" -> {
                    result.success(Build.TAGS)
                }
                "getDeviceInfo" -> {
                    val info = mapOf(
                        "fingerprint" to Build.FINGERPRINT,
                        "model" to Build.MODEL,
                        "manufacturer" to Build.MANUFACTURER,
                        "brand" to Build.BRAND,
                        "device" to Build.DEVICE,
                        "hardware" to Build.HARDWARE,
                        "product" to Build.PRODUCT
                    )
                    result.success(info)
                }
                else -> result.notImplemented()
            }
        }
    }
}
KOTLIN

      - name: Add INTERNET permission
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Set app label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="𝐂𝐚𝐫𝐝 𝐕𝐨𝐝𝐚𝐟𝐨𝐧𝐞"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Set package name
        run: |
          sed -i 's/com\.card\.card_vodafone/com.card.developerAlaa/g' \
            android/app/build.gradle \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/debug/AndroidManifest.xml \
            android/app/src/profile/AndroidManifest.xml 2>/dev/null || true

      - name: Install imagemagick
        run: sudo apt-get install -y imagemagick

      - name: Generate icons
        run: |
          SRC="assets/images/icon.png"
          declare -A sizes=(
            ["android/app/src/main/res/mipmap-mdpi"]=48
            ["android/app/src/main/res/mipmap-hdpi"]=72
            ["android/app/src/main/res/mipmap-xhdpi"]=96
            ["android/app/src/main/res/mipmap-xxhdpi"]=144
            ["android/app/src/main/res/mipmap-xxxhdpi"]=192
          )
          for dir in "${!sizes[@]}"; do
            size="${sizes[$dir]}"
            mkdir -p "$dir"
            convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher_round.png"
          done

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          PLAT="${{ github.event.inputs.target_platform }}"
          if [ "$OUT" = "apk" ]; then
            if [ "$PLAT" != "all" ]; then
              flutter build apk --$TYPE --target-platform $PLAT
            else
              flutter build apk --$TYPE
            fi
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
